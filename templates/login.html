<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Classe App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="auth-brand">ClasseApp</p>
        <h1>Entrar</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="auth-alert {{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="auth-email">Email:</label>
            <input id="auth-email" type="email" name="email" autocomplete="email" required>
            <label for="auth-password">Senha:</label>
            <input id="auth-password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>

        <div class="auth-links">
            <a href="/register">Criar nova conta</a>
        </div>
    </main>
</body>
</html>

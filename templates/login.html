<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Login - Classe App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="auth-brand">ClasseApp</p>
        <h1>Entrar</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="auth-alert {{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="auth-email">Email:</label>
            <input id="auth-email" type="email" name="email" autocomplete="email" required>
            <label for="auth-password">Senha:</label>
            <div class="auth-password-wrap">
                <input id="auth-password" type="password" name="password" autocomplete="current-password" required minlength="1">
                <button class="auth-eye" type="button" data-toggle-password="auth-password" title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.7"/>
                        <path class="auth-eye-slash" d="M3 21 21 3"/>
                    </svg>
                </button>
            </div>
            <button type="submit">Entrar</button>
        </form>

        <div class="auth-links">
            <a href="/register">Criar nova conta</a>
            <a href="{{ url_for('auth_bp.forgot_password') }}">Esqueci minha senha</a>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</body>
</html>

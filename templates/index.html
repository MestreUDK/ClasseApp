{% extends 'base.html' %}

{% block title %}Dashboard ClasseApp{% endblock %}

{% block content %}
    <h1>Visão Geral</h1>

    <div class="dashboard-grid">
        <div class="dash-card card-alunos">
            <div class="card-icon">👥</div>
            <div class="card-info">
                <h3>Alunos</h3>
                <p id="total-alunos">...</p>
            </div>
        </div>

        <div class="dash-card card-turmas">
            <div class="card-icon">🏫</div>
            <div class="card-info">
                <h3>Turmas</h3>
                <p id="total-turmas">...</p>
            </div>
        </div>

        <div class="dash-card card-freq">
            <div class="card-icon">📈</div>
            <div class="card-info">
                <h3>Freq. Média</h3>
                <p id="media-freq">...</p>
            </div>
        </div>
    </div>

    <hr style="margin: 2em 0; border: 0; border-top: 1px solid #eee;">

    <h2>Gerenciar Turmas</h2>

    <div class="card-form">
        <h3 style="margin-top:0;">Nova Turma</h3>

        <form id="form-turma" style="background: none; padding: 0; box-shadow: none; border: none; margin: 0;">
            <div>
                <label for="nome">Nome da Turma:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div>
                <label for="descricao">Descrição (opcional):</label>
                <input type="text" id="descricao" name="descricao">
            </div>

            <div>
                <label for="disciplina_id">Disciplina (opcional):</label>
                <select id="disciplina_id" name="disciplina_id">
                    <option value="">Carregando disciplinas...</option>
                </select>
            </div>

            <button type="submit" style="margin-top: 10px;">
                + Criar Turma
            </button>
        </form>
    </div>

    <h2>Turmas Ativas</h2>

    <div id="lista-turmas">
        <p>Carregando turmas...</p>
    </div>

    <style>
        .tag-disciplina {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--icon-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-top: 6px;
        }

        .bolinha-disciplina {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}

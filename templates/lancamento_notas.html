{% extends 'base.html' %}

{% block title %}Lançamento de Notas{% endblock %}

{% block content %}
    <h1 id="titulo-pagina">Notas</h1>
    <p id="subtitulo" style="color: var(--text-sec);">Carregando...</p>

    <a 
        href="" 
        id="link-voltar" 
        class="botao-acao" 
        style="margin-bottom: 1em; background-color: #6c757d;"
    >
        Voltar
    </a>

    <div class="card-form" style="padding: 10px;">
        <table id="tabela-notas">
            <thead>
                <tr>
                    <th style="width: 60%;">Aluno</th>
                    <th style="width: 40%; text-align: center;">Nota</th>
                </tr>
            </thead>

            <tbody id="tbody-notas"></tbody>
        </table>
    </div>

    <p style="font-size: 0.8em; color: var(--text-sec); text-align: center; margin-top: 10px;">
        * As notas são salvas automaticamente ao sair do campo.
    </p>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 10px;
            background: rgba(0,0,0,0.05);
            text-align: left;
            color: var(--text-main);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .input-nota {
            width: 80px;
            padding: 8px;
            text-align: center;
            font-size: 1.1em;
            margin: 0 auto;
            display: block;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
        }

        .salvando {
            opacity: 0.6;
        }

        .salvo {
            border-color: #28a745 !important;
        }

        .erro {
            border-color: #dc3545 !important;
        }

        .meta-avaliacao {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .tag-av {
            background: var(--icon-bg);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            color: var(--text-main);
            font-weight: 600;
        }
    </style>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/lancamento_notas.js') }}"></script>
{% endblock %}

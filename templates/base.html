<!DOCTYPE html>
<html lang="pt-br" data-appearance-user="{{ current_user.id if current_user.is_authenticated else 'visitante' }}">
<head>
    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>{% block title %}Classe App{% endblock %}</title>
    <script>
    // O identificador só permite selecionar a cópia local na aba já autenticada.
    // Não é credencial e não substitui autenticação. Nunca guardar tokens aqui.
    try {
        const conta = document.documentElement.dataset.appearanceUser;
        if (conta && conta !== 'visitante') {
            // Não reutilizar material de desbloqueio da conta anterior.
            const chaveDeSessao = 'classeapp:cofre:temporario:v1';
            const anterior = sessionStorage.getItem(chaveDeSessao);
            if (anterior) {
                try {
                    if (JSON.parse(anterior).usuario_id !== conta) {
                        sessionStorage.removeItem(chaveDeSessao);
                    }
                } catch (_) { sessionStorage.removeItem(chaveDeSessao); }
            }
            sessionStorage.setItem('classeapp:offline:conta-aba', conta);
        }
    } catch (_) { /* Armazenamento indisponível: o hub exibirá instruções. */ }
    document.addEventListener('click', event => {
        if (event.target.closest('a[href="/logout"]')) {
            try {
                sessionStorage.removeItem('classeapp:offline:conta-aba');
                sessionStorage.removeItem('classeapp:cofre:temporario:v1');
                window.ClasseOfflineAccess?.bloquear?.();
            } catch (_) {}
        }
    });
    </script>

    <!-- Define a aparência antes de carregar os estilos, evitando mudanças visuais ao abrir a página. -->
    <script src="{{ url_for('static', filename='js/aparencia.js', v=app_version) }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=app_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='aparencia.css', v=app_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='controles.css', v=app_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='password_visibility.css', v=app_version) }}">

    <link 
        rel="manifest" 
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <meta name="theme-color" content="#101827">

    <link 
        rel="apple-touch-icon" 
        href="{{ url_for('static', filename='icon/icon-192.png') }}"
    >
</head>

<body>

    <nav>
        <div class="links">

            <a href="/">
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>

                <span>Turmas</span>
            </a>

            <a href="/alunos">
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>

                <span>Alunos</span>
            </a>

            <a href="/disciplinas">
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>

                <span>Disciplinas</span>
            </a>

            <a href="/diario">
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>

                <span>Diário</span>
            </a>

            <a href="/relatorios">
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>

                <span>Relatórios</span>
            </a>

            <a href="/compartilhado">
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>

                <span>Compartilhado</span>
            </a>

        </div>

        <div class="nav-right">

            <form action="/search" method="GET">
                <input 
                    type="search" 
                    name="q" 
                    placeholder="Buscar..."
                    value="{{ query if query else '' }}"
                >

                <button type="submit">
                    🔍
                </button>
            </form>

            <button 
                id="theme-toggle" 
                class="btn-icon" 
                title="Alternar Tema"
            >
                <svg 
                    class="moon" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    style="display: block;"
                >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>

                <svg 
                    class="sun" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    style="display: none;"
                >
                    <circle cx="12" cy="12" r="5"></circle>

                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>

                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>

                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>

                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>

            <a href="/sincronizacao" class="btn-icon" title="Sincronização e versões" aria-label="Sincronização e versões" style="text-decoration:none;font-size:21px;">☁️</a>

            <a href="/configuracoes" class="btn-icon" title="Configurações" aria-label="Configurações" style="text-decoration:none; font-size:21px;">⚙️</a>

            <a href="/notificacoes" class="btn-icon" title="Notificações" aria-label="Central de notificações" style="text-decoration:none; font-size:22px;">🔔</a>

            <a 
                href="/perfil" 
                class="btn-icon" 
                title="Meu Perfil"
            >
                <svg 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    width="24" 
                    height="24"
                >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>

        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer" style="text-align:center; padding:18px 12px; color:var(--text-sec); font-size:.85rem;">
        ClasseApp &copy; {{ current_year }} &middot; Versão {{ app_version }}
    </footer>

    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/password_visibility.js', v=app_version) }}" defer></script>

    <script>

        // =========================
        // SERVICE WORKER
        // =========================

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('/sw.js')
                    .catch(err => console.error('SW Error:', err));
            });
        }


        // A escolha de claro/escuro e a personalização são geridas em aparencia.js.
        // O botão antigo da barra continua disponível e sincronizado com o Perfil.

    </script>

</body>
</html>

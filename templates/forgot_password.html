<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Recuperar senha — ClasseApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="auth-brand">ClasseApp</p>
        <h1>Recuperar senha</h1>
        <p class="auth-hint">Informe o e-mail da sua conta. Enviaremos um link para definir uma nova senha.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="auth-alert {{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <label for="auth-email">E-mail</label>
            <input id="auth-email" type="email" name="email" autocomplete="email" maxlength="254" required>
            <button type="submit">Enviar link de recuperação</button>
        </form>
        <div class="auth-links"><a href="{{ url_for('auth_bp.login') }}">Voltar para o login</a></div>
    </main>
</body>
</html>

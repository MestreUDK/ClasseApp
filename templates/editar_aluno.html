{% extends 'base.html' %}

{% block title %}Editar Aluno{% endblock %}

{% block content %}
    <h1>Editar Aluno</h1>

    <form id="form-edit-aluno">
        <input type="hidden" id="aluno_id">
        <div>
            <label for="nome_completo">Nome Completo:</label>
            <input type="text" id="nome_completo" name="nome_completo" required>
        </div>
        <div>
            <label for="matricula">Matrícula (opcional):</label>
            <input type="text" id="matricula" name="matricula">
        </div>
        <div>
            <label for="telefone">Telefone/WhatsApp:</label>
            <input type="text" id="telefone" name="telefone">
        </div>
        <div>
            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email">
        </div>

        <div>
            <label>Data de nascimento / aniversário (opcional):</label>
            <div class="data-aniversario-campos" role="group" aria-label="Nascimento: dia, mês e ano opcional">
                <label for="nascimento_dia">Dia
                    <input type="number" id="nascimento_dia" min="1" max="31" step="1" inputmode="numeric" placeholder="DD">
                </label>
                <label for="nascimento_mes">Mês
                    <input type="number" id="nascimento_mes" min="1" max="12" step="1" inputmode="numeric" placeholder="MM">
                </label>
                <label for="nascimento_ano">Ano (opcional)
                    <input type="number" id="nascimento_ano" min="1" max="9999" step="1" inputmode="numeric" placeholder="AAAA">
                </label>
            </div>
            <small class="data-aniversario-ajuda">Informe dia e mês para receber avisos; acrescente o ano para mostrar a idade que o aluno completará.</small>
        </div>
        <div>
            <label for="detalhes">Detalhes Extras (opcional):</label>
            <textarea id="detalhes" name="detalhes" rows="3" placeholder="Observações médicas, necessidades especiais, etc..."></textarea>
        </div>

        <button type="submit">Salvar Alterações</button>

        <p id="msg-erro" style="display: none; margin-top: 10px; color: red; font-weight: bold;"></p>
        <p id="msg-sucesso" style="display: none; margin-top: 10px; color: green; font-weight: bold;"></p>
    </form>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/data_aniversario.js', v=app_version) }}"></script>
    <script src="{{ url_for('static', filename='js/editar_aluno.js', v=app_version) }}"></script>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <meta name="referrer" content="no-referrer">
    <title>Nova senha — ClasseApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="auth-brand">ClasseApp</p>
        <h1>Definir nova senha</h1>
        <div id="reset-message" class="auth-alert info" role="status">Verificando o link de recuperação...</div>
        <form id="reset-form" data-submit-url="{{ url_for('auth_bp.reset_password') }}" hidden>
            <label for="new-password">Nova senha (mínimo 8 caracteres)</label>
            <div class="auth-password-wrap">
                <input id="new-password" type="password" name="password" minlength="8" maxlength="256" autocomplete="new-password" required>
                <button class="auth-eye" type="button" data-toggle-password="new-password" title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.7"/>
                        <path class="auth-eye-slash" d="M3 21 21 3"/>
                    </svg>
                </button>
            </div>
            <label for="confirm-password">Confirmar nova senha</label>
            <div class="auth-password-wrap">
                <input id="confirm-password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
                <button class="auth-eye" type="button" data-toggle-password="confirm-password" title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.7"/><path class="auth-eye-slash" d="M3 21 21 3"/>
                    </svg>
                </button>
            </div>
            <button id="save-password" type="submit">Salvar nova senha</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth_bp.forgot_password') }}">Solicitar outro link</a>
            <a href="{{ url_for('auth_bp.login') }}">Voltar para o login</a>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/reset_password.js') }}" defer></script>
</body>
</html>
